name: Build and deploy Flet app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required Supabase secrets
        run: |
          python - <<'PY'
          import os

          missing = [
              key
              for key in ("SUPABASE_URL", "SUPABASE_KEY")
              if not os.environ.get(key, "").strip()
          ]
          if missing:
              raise SystemExit(
                  "Faltan secrets requeridos en el repositorio: "
                  + ", ".join(missing)
              )
          print("Secrets de Supabase configurados.")
          PY

      - name: Generate web Supabase config
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          url = os.environ["SUPABASE_URL"].strip().rstrip("/")
          key = os.environ["SUPABASE_KEY"].strip()
          contenido = (
              '"""Configuración generada en CI para despliegue web."""\n'
              f"SUPABASE_URL = {url!r}\n"
              f"SUPABASE_KEY = {key!r}\n"
          )
          Path("app/datos/config_web.py").write_text(contenido, encoding="utf-8")
          print("config_web.py generado.")
          PY

      - name: Build Flet web app
        run: |
          flet build web --yes --base-url /found-unsa/ --route-url-strategy hash

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
